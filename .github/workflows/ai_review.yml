name: AI Code Review

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  review:
    # 组合条件限制：
    # 1. 必须包含 'ai-review' 标签
    # 2. 触发者 (github.actor) 必须是你自己（替换为你的 GitHub ID）
    if: |
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      (github.actor == github.repository_owner || github.actor == '你的GitHub用户名')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run AI Reviewer
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
          AI_MODEL_NAME: "qwen-max"
        run: |
          bundle exec ruby bin/ai-code-review \
            --platform github \
            --repo ${{ github.repository }} \
            --pr ${{ github.event.pull_request.number }}